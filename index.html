<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabriela Flowers</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #fdfcfb, #f3efe9);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #2c2c2c;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 25px;
      padding: 30px 25px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .mensaje {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      margin-bottom: 20px;
      line-height: 1.4;
      color: #444;
    }

    img {
      width: 100%;
      border-radius: 20px;
      margin: 20px 0;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    .info {
      font-size: 14px;
      line-height: 1.7;
      margin-top: 10px;
      color: #555;
    }

    .info strong {
      display: block;
      margin-top: 5px;
      font-weight: 400;
    }

    footer {
      margin-top: 25px;
      font-size: 12px;
      color: #999;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>
  <div class="container">
    
    <h1>Gabriela Flowers</h1>

    <div class="mensaje">
      Этот букет был подарен с любовью 💐
    </div>

    <img src="flor.png" alt="Ramo de flores">

    <div class="info">
      <strong>От: Иван</strong>
      <strong>Для: Мария</strong>
      <strong>Дата: 14 февраля 2026</strong>
    </div>

    <footer>
      Created by AGAM Inc.
    </footer>

  </div>
</body>
</html>
